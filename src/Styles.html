<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --border: rgba(11,11,11,0.10);
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
    --real: #2a78d6; --ppto: #b3b2ab; --accent: #2a78d6; --accent-ink: #ffffff;
    --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --div-neg: #2a78d6; --div-mid: #f0efec; --div-pos: #e34948;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --border: rgba(255,255,255,0.10);
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --real: #3987e5; --ppto: #5d5c57; --accent: #3987e5;
      --good-ink: #0ca30c; --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* layout */
  /* barras opacas: nada se transparenta ni se difumina por debajo */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 140px; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 110px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  nav.tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 6px 4px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--ink-2); cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  nav.tabs button { position: relative; }
  nav.tabs .badge { position: absolute; top: 0; left: calc(50% + 4px); }
  @media (min-width: 900px) {
    nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--border); padding: 4px 8px; }
    nav.tabs button { flex-direction: row; font-size: 14px; gap: 6px; max-width: 170px; }
    nav.tabs button svg { width: 18px; height: 18px; }
    nav.tabs .badge { position: static; }
    header.top { position: static; }
    main { padding-bottom: 40px; }
  }

  /* controls */
  select, input[type=text], input[type=number], input[type=search], textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-height: 38px; }
  textarea { width: 100%; min-height: 70px; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; min-height: 38px; white-space: nowrap; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.spread { justify-content: space-between; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
  label.field > input, label.field > select { color: var(--ink); }
  .check { display: flex; gap: 8px; align-items: center; }

  /* cambio de pantalla al deslizar */
  @keyframes from-right { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes from-left { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
  main.enter-right { animation: from-right .22s ease-out; }
  main.enter-left { animation: from-left .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { main.enter-right, main.enter-left { animation: none; } }
  .dots { display: none; }
  @media (max-width: 899px) {
    .dots { display: flex; justify-content: center; gap: 6px; position: fixed; left: 0; right: 0; z-index: 6;
      bottom: calc(62px + env(safe-area-inset-bottom)); pointer-events: none; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); transition: width .2s, background .2s; }
    .dots i.on { width: 16px; border-radius: 3px; background: var(--accent); }
  }

  /* bandeja deslizable */
  .mov.swipeable { position: relative; touch-action: pan-y; transition: transform .18s ease-out, opacity .18s, height .22s, padding .22s; background: var(--page); }
  .mov.swipeable::before { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; width: 160px; font-size: 13px; font-weight: 600; opacity: .5; }
  .mov.drag-right::before { content: attr(data-acc); right: 100%; justify-content: flex-end; padding-right: 14px; color: var(--good-ink); }
  .mov.drag-left::before { content: "Clasificar ›"; left: 100%; padding-left: 14px; color: var(--accent); }
  .mov.armed::before { opacity: 1; }
  .mov.gone { height: 0 !important; padding-top: 0; padding-bottom: 0; overflow: hidden; border: 0; }
  main { overflow-x: clip; }
  .toast-btn { margin-left: 12px; background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }
  .info { color: var(--accent); cursor: pointer; font-size: 13px; }
  @media (max-width: 600px) { .dcol { display: none; } }
  .dbar { position: relative; display: block; height: 8px; background: var(--surface-2); border-radius: 4px; }
  .dbar > span { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .dbar .neg { background: var(--div-pos); } .dbar .pos { background: var(--div-neg); }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  .card .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
  .grid { display: grid; gap: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, 1fr); } .grid.two { grid-template-columns: 1fr 1fr; } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--ink-2); }
  .kpi .value { font-size: 24px; font-weight: 650; margin: 2px 0; letter-spacing: -0.01em; }
  .kpi .foot { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* status (icono + texto; nunca solo color) */
  .st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .st.ok::before { background: var(--good); } .st.aviso::before { background: var(--warning); }
  .st.alerta::before { background: var(--critical); } .st.sin-ppto::before { background: var(--serious); }
  .badge { background: var(--critical); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; font-weight: 600; }
  .banner { border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; background: color-mix(in srgb, var(--warning) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 50%, transparent); font-size: 14px; }
  .banner.err { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }

  /* tables */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-weight: 600; color: var(--ink-2); font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  tr.block td { font-weight: 650; background: var(--surface-2); cursor: pointer; }
  tr.line td:first-child { padding-left: 20px; }
  tr.line { cursor: pointer; }
  tr.line:hover td { background: var(--surface-2); }
  .neg { color: var(--ink); } .pos { color: var(--ink); }
  td input { width: 74px; text-align: right; padding: 4px 6px; min-height: 30px; }
  td input.wide { width: 100%; text-align: left; }

  /* movimientos */
  .mov { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--grid); cursor: pointer; }
  .mov:hover { background: var(--surface-2); }
  .mov .c { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .d { font-size: 12px; color: var(--muted); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .a { text-align: right; font-weight: 600; }
  .mov .t { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .chip.estado-pendiente { border-style: dashed; color: var(--ink-2); }
  .chip.estado-propuesta { border-style: dashed; }
  .day { font-size: 12px; color: var(--ink-2); font-weight: 600; margin: 14px 0 2px; }
  .day::first-letter { text-transform: uppercase; }

  /* insights */
  h2.section { font-size: 13px; margin: 18px 2px 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  .ins h3 { margin: 0; font-size: 16px; }
  .ins ul { margin: 8px 0 0; padding-left: 18px; }
  .ins li { margin: 4px 0; }
  .bars-mini { margin-top: 10px; display: grid; gap: 4px; font-size: 12px; }
  .bars-mini .b { display: grid; grid-template-columns: minmax(90px, 36%) 1fr auto; gap: 8px; align-items: center; }
  .bars-mini .b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars-mini .bar { height: 8px; border-radius: 4px; background: var(--real); }
  .bars-mini .bar.new { background: repeating-linear-gradient(135deg, var(--real) 0 3px, color-mix(in srgb, var(--real) 45%, var(--surface)) 3px 6px); }

  /* charts */
  .chart { width: 100%; position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 6px 24px rgba(0,0,0,.12);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 140px; display: none; }
  .tip b { display: block; margin-bottom: 4px; font-size: 13px; }
  .tip .r { display: flex; justify-content: space-between; gap: 12px; }
  .heat { overflow-x: auto; }
  .heat table td { text-align: center; padding: 0; border: 2px solid var(--surface); font-size: 11px; height: 30px; min-width: 44px; }
  .heat table td:first-child { text-align: left; padding: 0 8px 0 0; font-size: 12px; min-width: 110px; border: 0; }

  /* sheet (modal) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
  .sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--surface);
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); display: none; box-shadow: 0 -8px 40px rgba(0,0,0,.2); }
  @media (min-width: 700px) { .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: 560px; border-radius: 18px; } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet .stack { display: grid; gap: 12px; margin-top: 12px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--page);
    padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; display: none; max-width: 90vw; }
  .loading { opacity: .55; pointer-events: none; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .empty { text-align: center; color: var(--ink-2); padding: 30px 10px; }
  details summary { cursor: pointer; font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
